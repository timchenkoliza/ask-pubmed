  padding: 4px 12px 4px 8px;
  border-radius: 999px;
  background: var(--structural);
  box-shadow: inset 0 0 0 1px var(--surface);
  font: 500 13px/1.4 var(--sans);
}
.dr-modes {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.dr-mode {
  display: grid;
  align-content: start;
  gap: 4px;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  background: var(--canvas);
  color: var(--text);
  text-align: left;
}
.dr-mode:hover {
  background: var(--structural);
}
.dr-mode[aria-checked='true'] {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.dr-mode-n {
  font: 700 15px/1.3 var(--sans);
}
.dr-mode[aria-checked='true'] .dr-mode-n {
  color: var(--kind-req-fg);
}
.dr-mode-t {
  font: 400 13px/1.4 var(--sans);
  color: var(--text-2);
}
.dr-srcs {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
  font: 400 14px/1.45 var(--sans);
}
.dr-srcs li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.dr-srcs svg {
  flex: none;
  margin-top: 2px;
  color: var(--accent-ink);
}
.dr-steps {
  display: grid;
  gap: 8px;
  margin: 0;
  padding-left: 24px;
  font: 400 15px/1.45 var(--sans);
}
.dr-steps--run {
  padding-left: 0;
  list-style: none;
}
.dr-steps--run li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  color: var(--text-2);
}
.dr-steps--run li.is-now {
  color: var(--text);
  font-weight: 600;
}
.dr-steps--run li.is-done {
  color: var(--text);
}
.dr-mark {
  flex: none;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  margin-top: 0;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  color: var(--accent-ink);
}
.is-done .dr-mark {
  border-color: var(--accent-ink);
  background: var(--accent-ink);
  color: var(--inverse-text);
}
.is-now .dr-mark {
  border-color: var(--accent);
}
.spin {
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  .spin {
    animation: none;
  }
}
.dr-bar {
  height: 6px;
  border-radius: 3px;
  background: var(--surface);
  overflow: hidden;
}
.dr-bar span {
  display: block;
  height: 100%;
  background: var(--accent-ink);
  transition: width 0.6s ease;
}
.dr-acts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.dr-note {
  margin: -8px 0 0;
  font: 400 13px/1.4 var(--sans);
  color: var(--text-2);
}
.dr-tag {
  margin: 0;
  justify-self: start;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--structural);
  box-shadow: inset 0 0 0 1px var(--surface);
  color: var(--text-2);
  font: 600 12px/1.4 var(--sans);
}
.dr-sum {
  margin: 0;
  font: 400 16px/1.55 var(--sans);
  text-wrap: pretty;
}
.dr-points {
  display: grid;
  gap: 8px;
  margin: 0;
  padding-left: 20px;
  font: 400 15px/1.5 var(--sans);
}
.rail-note {
  margin: 0 0 12px;
  font: 400 13px/1.45 var(--sans);
  color: var(--text-2);
}
.rail-ask {
  width: 100%;
  white-space: normal;
}

@media (max-width: 820px) {
  .pbz {
    grid-template-columns: minmax(0, 1fr);
  }
  .pbz-side {
    display: none;
  }
  .pbz-main {
    padding: 16px 14px;
  }
  .ctx {
    flex-wrap: wrap;
  }
  .dr {
    padding: 20px 16px 24px;
  }
  .dr-modes {
    grid-template-columns: minmax(0, 1fr);
  }
  .rail-card--ask {
    order: 5;
  }
}
.dr-acts--sticky {
  position: sticky;
  bottom: 0;
  z-index: 2;
  margin: 0 -28px;
  padding: 16px 28px;
  background: linear-gradient(to bottom, transparent, var(--canvas) 28%);
}
@media (max-width: 820px) {
  .dr-acts--sticky {
    position: static;
    margin: 0;
    padding: 0;
    background: none;
  }
  .pbz-thread {
    padding-bottom: 8px;
  }
}
.dr-mode[aria-checked='true'] .dr-mode-t {
  color: var(--text);
}

/* Поле ввода внутри составной рамки: кольцо фокуса у рамки, как у главного поля запроса */
.follow-form:focus-within,
.pbz-composer:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

</style>
</head>
<body>
